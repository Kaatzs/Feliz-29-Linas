<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Una caja fuerte para ti</title>
<style>
:root{--vino:#2a1220;--vino2:#43192f;--laton:#c9a45c;--papel:#f3e7d3;--acero:#3b4048;--rosa:#d46a7e}
*{box-sizing:border-box;margin:0}
html,body{min-height:100%}
body{background:radial-gradient(ellipse at 50% 30%,var(--vino2),var(--vino) 70%);color:var(--papel);font-family:Georgia,"Times New Roman",serif;padding:24px 16px 48px;line-height:1.5}
h1{font-size:clamp(1.6rem,5vw,2.4rem);font-weight:normal;text-align:center;margin-bottom:6px}
.sub{text-align:center;opacity:.75;margin-bottom:28px}
main{max-width:920px;margin:0 auto;display:grid;gap:32px;grid-template-columns:1fr 1fr;align-items:start}
@media(max-width:760px){main{grid-template-columns:1fr}}
h2{font-size:1.1rem;font-weight:normal;margin-bottom:12px;color:var(--laton)}
/* pared de fotos */
.fotos{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:14px}
.foto{background:var(--papel);padding:8px 8px 22px;border:0;cursor:pointer;transform:rotate(var(--r,0deg));transition:transform .2s}
.foto:nth-child(odd){--r:-2deg}.foto:nth-child(even){--r:2deg}
.foto:hover,.foto:focus-visible{transform:rotate(0) scale(1.05);outline:2px solid var(--laton)}
.foto img{width:100%;aspect-ratio:1;object-fit:cover;display:block;background:#bbb}
.camara{margin-top:22px;display:flex;align-items:center;gap:12px;background:var(--acero);color:var(--papel);border:2px solid var(--laton);padding:12px 18px;border-radius:10px;font:inherit;cursor:pointer}
.camara:hover,.camara:focus-visible{background:#4a505a;outline:none}
.camara svg{width:34px;height:34px}
/* caja fuerte */
.caja{background:linear-gradient(145deg,#565d68,var(--acero));border:6px solid #2a2e35;border-radius:14px;padding:22px;text-align:center;box-shadow:0 14px 40px #0008;position:relative}
.puerta{transition:transform 1.1s ease;transform-origin:left center}
.caja.abierta .puerta{transform:perspective(900px) rotateY(-100deg);opacity:.15;pointer-events:none}
.pantalla{background:#10160f;color:#8dff9b;font:2rem/1 "Courier New",monospace;letter-spacing:.5em;padding:14px 0 14px .5em;border-radius:6px;margin-bottom:16px;min-height:3.4rem}
.pantalla.mal{animation:sacudir .4s;color:#ff7a7a}
@keyframes sacudir{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.teclas{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:260px;margin:0 auto}
.teclas button{font:1.3rem Georgia,serif;padding:12px 0;border-radius:8px;border:2px solid #23262c;background:#7a828f;color:#111;cursor:pointer}
.teclas button:hover,.teclas button:focus-visible{background:var(--laton);outline:none}
.teclas .ok{background:var(--rosa)}
.aviso{margin-top:14px;min-height:1.5em;font-size:.95rem}
.adentro{display:none;padding:10px}
.caja.abierta .adentro{display:block}
.caja.abierta .puerta{position:absolute;inset:0}
.adentro button{margin-top:10px;background:var(--papel);color:var(--vino);border:0;padding:12px 20px;border-radius:8px;font:1.05rem Georgia,serif;cursor:pointer}
/* ventanas */
dialog{border:0;border-radius:6px;max-width:min(92vw,640px);width:100%;padding:0;background:var(--papel);color:#2b1d14}
dialog::backdrop{background:#000b}
.cierra{position:absolute;top:8px;right:12px;background:none;border:0;font-size:1.8rem;cursor:pointer;color:inherit}
.cuerpo{padding:34px 28px 28px}
.carta{font-family:"Segoe Script","Brush Script MT","Comic Sans MS",cursive;font-size:1.15rem;line-height:1.8;white-space:pre-wrap;max-height:70vh;overflow:auto}
dialog img,dialog video{width:100%;display:block;max-height:75vh;object-fit:contain;background:#000}
.pie{padding:12px 20px;font-style:italic}
.musica{position:fixed;right:14px;bottom:14px;background:var(--acero);color:var(--papel);border:2px solid var(--laton);border-radius:50%;width:46px;height:46px;font-size:1.3rem;cursor:pointer;display:none}
.musica.on{display:block}
@media(prefers-reduced-motion:reduce){.puerta{transition:none}.pantalla.mal{animation:none}}
</style>
</head>
<body>
<h1 id="titulo"></h1>
<p class="sub" id="subtitulo"></p>

<main>
  <section>
    <h2>Las pistas están en nuestros recuerdos</h2>
    <div class="fotos" id="fotos"></div>
    <button class="camara" id="btnCamara">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 8h3l1.5-2h7L17 8h3v11H4z"/><circle cx="12" cy="13.5" r="3.6"/></svg>
      <span>Lo que la cámara grabó </span>
    </button>
  </section>

  <section>
    <h2>La caja</h2>
    <div class="caja" id="caja">
      <div class="puerta">
        <div class="pantalla" id="pantalla" aria-live="polite"></div>
        <div class="teclas" id="teclas"></div>
        <p class="aviso" id="aviso">Escribe la clave.</p>
      </div>
      <div class="adentro">
        <p>La caja se abrió.</p>
        <button id="btnCarta">Leer la carta</button>
      </div>
    </div>
  </section>
</main>

<dialog id="dFoto"><button class="cierra" aria-label="Cerrar">×</button><img id="fotoGrande" alt=""><p class="pie" id="pista"></p></dialog>
<dialog id="dVideo"><button class="cierra" aria-label="Cerrar">×</button><video id="video" controls playsinline></video></dialog>
<dialog id="dCarta"><button class="cierra" aria-label="Cerrar">×</button><div class="cuerpo"><div class="carta" id="carta"></div></div></dialog>

<audio id="audio" loop></audio>
<button class="musica" id="btnMusica" aria-label="Pausar o reanudar música">♪</button>

<script>
/* ====== EDITA AQUÍ ====== */
const CONFIG = {
  titulo: "Tengo algo para ti",
  subtitulo: "Encuentra la clave y abre la caja fuerte.",
  clave: "6092",                       // la clave (solo números)
  fotos: [                              // pon tus archivos en la carpeta recursos/
    { src: "recursos/foto1.jpg", pista: "Nuestro mes, nuestra vida" },
    { src: "recursos/foto2.jpg", pista: "Del 0-10 cuanto sabes nadar." },
    { src: "recursos/foto3.jpg", pista: "Cuantas horas duermes." },
    { src: "recursos/foto4.jpg", pista: "Fuimos ... almas destinadas a estar." }
  ],
  video: "recursos/video.mp4",
  cancion: "recursos/cancion.mp3",
  carta: `Mi amor, mi increible amor

Hoy que le agregamos un mes a la vida que queremos formar, me siento agradecido por compartir todos los recuerdos y momentos con la persona que mas amo en la vida. por eso quiero esforzarme para poder estar felices y agradecer cada dia que pasa estando junto a ti, eres ahora la mujer que me ha ayudado a comprender el amor y ha tenido la paciencia para afrontar todas las caidas que hemos tenido. un dia como hoy recuerdo lo maravilloso que han sido los dias riendo, hablando, charlando, en silencio contigo, aunque vuelvan los dias digitales se que esperamos con ansias esos dias donde podamos estar viendo el cielo juntos y planear en donde vamos a comer picadas. quiero cumplir con todas las expectativas que tenemos, aunque no las digamos nos conocemos tanto que coincidimos en lo que queremos construir, lo que vamos a lograr y sentirnos lleno por el amor que crece cada dia mas.

Y sobre todo ser lo tranquilo, sereno y contar con el apoyo grande en cual confiar.

Con cariño y amor
Ese niño que aprendio a amar con la mujer correcta.`
};
/* ========================= */

const $ = id => document.getElementById(id);
$("titulo").textContent = CONFIG.titulo;
$("subtitulo").textContent = CONFIG.subtitulo;
$("carta").textContent = CONFIG.carta;
$("audio").src = CONFIG.cancion;
$("video").src = CONFIG.video;

// fotos
CONFIG.fotos.forEach((f, i) => {
  const b = document.createElement("button");
  b.className = "foto";
  b.innerHTML = `<img src="${f.src}" alt="Foto ${i + 1}">`;
  b.onclick = () => { $("fotoGrande").src = f.src; $("pista").textContent = f.pista; $("dFoto").showModal(); };
  $("fotos").appendChild(b);
});

// cerrar ventanas
document.querySelectorAll("dialog").forEach(d => {
  d.querySelector(".cierra").onclick = () => d.close();
  d.addEventListener("click", e => { if (e.target === d) d.close(); });
  d.addEventListener("close", () => { const v = d.querySelector("video"); if (v) v.pause(); });
});
$("btnCamara").onclick = () => {
  $("dVideo").showModal();
  $("video").currentTime = 0;
  $("video").play().catch(() => {});
};
$("btnCarta").onclick = () => $("dCarta").showModal();

// teclado
let entrada = "";
const N = CONFIG.clave.length;
const pantalla = $("pantalla");
function pintar() { pantalla.textContent = entrada.padEnd(N, "•").split("").join(" ").replace(/ /g, ""); }
["1","2","3","4","5","6","7","8","9","←","0","OK"].forEach(t => {
  const b = document.createElement("button");
  b.textContent = t;
  if (t === "OK") b.className = "ok";
  b.onclick = () => tecla(t);
  $("teclas").appendChild(b);
});
document.addEventListener("keydown", e => {
  if (document.querySelector("dialog[open]")) return;
  if (/^\d$/.test(e.key)) tecla(e.key);
  else if (e.key === "Backspace") tecla("←");
  else if (e.key === "Enter") tecla("OK");
});
function tecla(t) {
  if ($("caja").classList.contains("abierta")) return;
  if (t === "←") entrada = entrada.slice(0, -1);
  else if (t === "OK") return comprobar();
  else if (entrada.length < N) entrada += t;
  $("aviso").textContent = "Escribe la clave.";
  pintar();
  if (entrada.length === N) comprobar();
}
function comprobar() {
  if (entrada === CONFIG.clave) return abrir();
  pantalla.classList.add("mal");
  $("aviso").textContent = "Clave incorrecta. Mira otra vez las fotos.";
  setTimeout(() => { pantalla.classList.remove("mal"); entrada = ""; pintar(); }, 500);
}
function abrir() {
  $("caja").classList.add("abierta");
  const a = $("audio");
  a.play().catch(() => {});
  $("btnMusica").classList.add("on");
  setTimeout(() => $("dCarta").showModal(), 1300);
}
$("btnMusica").onclick = () => { const a = $("audio"); a.paused ? a.play() : a.pause(); };
pintar();
</script>
</body>
</html>
